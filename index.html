<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-powered nose surgery preview tool. Visualize different nose shapes and see realistic results before making decisions." />
    <meta name="keywords" content="nose surgery, rhinoplasty preview, nose shape, AI face morphing, cosmetic surgery preview" />
    <meta name="author" content="NoseShape Tester" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NoseShape Tester - AI Nose Surgery Preview" />
    <meta property="og:description" content="Visualize your perfect nose with AI-powered surgery preview technology." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <title>NoseShape Tester - AI Nose Surgery Preview</title>

    <style>
      /* Prevent FOUC */
      html { visibility: hidden; }
      html.hydrated { visibility: visible; }
    </style>
    <script>
      // Apply theme immediately to prevent flash
      (function() {
        const stored = localStorage.getItem('nose-shape-tester-storage');
        let theme = 'system';
        if (stored) {
          try {
            const data = JSON.parse(stored);
            theme = data.state?.theme || 'system';
          } catch (e) {}
        }

        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }

        document.documentElement.classList.add('hydrated');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
